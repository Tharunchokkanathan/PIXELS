{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block body_class %}login-body{% endblock %}

{% block content %}
<!-- Decorative Elements -->
<div class="glass-decoration top-right"></div>
<div class="glass-decoration bottom-left"></div>

<div class="theme-toggle-wrapper login-theme-wrapper">
    <button id="theme-toggle" class="theme-toggle glass-button" onclick="toggleTheme()">
        <i class="fas fa-moon"></i>
    </button>
</div>

<div class="login-wrapper">
    <div class="modern-login-card">
        <div class="login-header">
            <div class="icon-pulse">
                <i class="fas fa-code"></i>
            </div>
            <h2>PIXELS</h2>
            <p>Enter your credentials to continue</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST" class="modern-login-form">
            <div class="input-group">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" id="email" name="email" placeholder="Email Address" required autofocus>
                <div class="input-focus-line"></div>
            </div>

            <div class="input-group">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="password" name="password" placeholder="Password" required>
                <div class="input-focus-line"></div>
            </div>

            <button type="submit" class="btn login-btn glow-effect">
                <span>Sign In <i class="fas fa-arrow-right"></i></span>
            </button>
        </form>

        <div class="demo-hints">
            <p class="demo-title">Need access?</p>
            <div class="demo-chips">
                <span class="chip" onclick="document.getElementById('email').value='leader1@gmail.com'; document.getElementById('password').value='leader123';">Admin Demo</span>
                <span class="chip" onclick="document.getElementById('email').value='member1@gmail.com'; document.getElementById('password').value='member123';">Member Demo</span>
            </div>
        </div>
    </div>
</div>

<style>
/* Modern Login Specific Styles */
.login-body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    position: relative;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    background-color: #eaefff;
    background-image:
        radial-gradient(900px circle at 10% 15%, rgba(99, 102, 241, 0.40), transparent 62%),
        radial-gradient(800px circle at 92% 8%, rgba(56, 189, 248, 0.34), transparent 60%),
        radial-gradient(900px circle at 82% 92%, rgba(236, 72, 153, 0.26), transparent 64%),
        radial-gradient(700px circle at 16% 94%, rgba(45, 212, 191, 0.26), transparent 60%),
        linear-gradient(160deg, #f8faff 0%, #e6ecff 55%, #dde6ff 100%);
}

[data-theme='dark'] .login-body {
    background-color: #05060f;
    background-image:
        radial-gradient(900px circle at 12% 12%, rgba(79, 70, 229, 0.55), transparent 62%),
        radial-gradient(800px circle at 90% 10%, rgba(14, 165, 233, 0.34), transparent 60%),
        radial-gradient(900px circle at 84% 90%, rgba(168, 85, 247, 0.40), transparent 64%),
        radial-gradient(700px circle at 14% 92%, rgba(236, 72, 153, 0.22), transparent 60%),
        linear-gradient(160deg, #05060f 0%, #0a0f22 55%, #070713 100%);
}

/* Fine grid texture, faded towards the edges */
.login-body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(to right, rgba(30, 41, 59, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(30, 41, 59, 0.06) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 10%, transparent 78%);
    mask-image: radial-gradient(circle at 50% 45%, #000 10%, transparent 78%);
    pointer-events: none;
    z-index: 1;
}

[data-theme='dark'] .login-body::before {
    background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.055) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.055) 1px, transparent 1px);
}

/* Slow-drifting aurora glow */
.login-body::after {
    content: '';
    position: absolute;
    inset: -35%;
    background: conic-gradient(from 0deg at 50% 50%,
        rgba(99, 102, 241, 0.30),
        rgba(56, 189, 248, 0.24),
        rgba(236, 72, 153, 0.22),
        rgba(45, 212, 191, 0.20),
        rgba(99, 102, 241, 0.30));
    filter: blur(90px);
    animation: auroraDrift 28s linear infinite;
    pointer-events: none;
    z-index: 0;
}

@keyframes auroraDrift {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
}

@media (prefers-reduced-motion: reduce) {
    .login-body::after { animation: none; }
    .icon-pulse { animation: none; }
}

.glass-decoration {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    z-index: 2;
    opacity: 0.35;
    pointer-events: none;
}

.glass-decoration.top-right {
    top: -150px;
    right: -150px;
    width: 500px;
    height: 500px;
    background: var(--primary-color);
}

.glass-decoration.bottom-left {
    bottom: -150px;
    left: -150px;
    width: 600px;
    height: 600px;
    background: #ec4899;
}

[data-theme='dark'] .glass-decoration {
    opacity: 0.28;
}

.login-theme-wrapper {
    position: absolute;
    top: 30px;
    right: 40px;
    z-index: 20;
}

.glass-button {
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: var(--text-primary);
    width: 45px;
    height: 45px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
}

.glass-button:hover {
    background: rgba(255, 255, 255, 0.4);
    transform: translateY(-2px);
}

.login-wrapper {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 420px;
    padding: 20px;
}

.modern-login-card {
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.7);
    border-radius: 24px;
    padding: 40px;
    box-shadow:
        0 24px 60px rgba(30, 41, 59, 0.16),
        0 2px 0 rgba(255, 255, 255, 0.5) inset;
    transform: translateY(0);
    transition: transform 0.4s ease, box-shadow 0.4s ease;
}

[data-theme='dark'] .modern-login-card {
    background: rgba(15, 20, 38, 0.72);
    border-color: rgba(255, 255, 255, 0.09);
    box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.6),
        0 1px 0 rgba(255, 255, 255, 0.06) inset;
}

.modern-login-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
}

.login-header {
    text-align: center;
    margin-bottom: 35px;
}

.icon-pulse {
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px auto;
    font-size: 28px;
    color: white;
    box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.4); }
    70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(79, 70, 229, 0); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(79, 70, 229, 0); }
}

.login-header h2 {
    font-size: 30px;
    font-weight: 800;
    color: var(--text-primary);
    margin-bottom: 8px;
    letter-spacing: 4px;
    text-transform: uppercase;
}

.login-header p {
    font-size: 14px;
    color: var(--text-secondary);
}

.input-group {
    position: relative;
    margin-bottom: 25px;
}

.input-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-secondary);
    font-size: 16px;
    transition: color 0.3s ease;
}

.input-group input {
    width: 100%;
    padding: 16px 16px 16px 45px;
    background: rgba(0, 0, 0, 0.02);
    border: 2px solid transparent;
    border-radius: 12px;
    font-size: 15px;
    color: var(--text-primary);
    transition: all 0.3s ease;
    outline: none;
}

[data-theme='dark'] .input-group input {
    background: rgba(255, 255, 255, 0.05);
}

.input-focus-line {
    position: absolute;
    bottom: 0;
    left: 10px;
    right: 10px;
    height: 2px;
    background: var(--primary-color);
    transform: scaleX(0);
    transition: transform 0.3s ease;
    border-radius: 2px;
}

.input-group input:focus {
    background: transparent;
}

.input-group input:focus ~ .input-icon {
    color: var(--primary-color);
}

.input-group input:focus ~ .input-focus-line {
    transform: scaleX(1);
}

.btn.glow-effect {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 10px;
    position: relative;
    overflow: hidden;
}

.btn.glow-effect::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.5s ease;
}

.btn.glow-effect:hover::before {
    left: 100%;
}

.btn.glow-effect:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(79, 70, 229, 0.4);
}

.demo-hints {
    margin-top: 30px;
    text-align: center;
    padding-top: 20px;
    border-top: 1px solid rgba(150, 150, 150, 0.2);
}

.demo-title {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.demo-chips {
    display: flex;
    justify-content: center;
    gap: 10px;
}

.chip {
    padding: 6px 14px;
    background: rgba(150, 150, 150, 0.1);
    color: var(--text-secondary);
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    border: 1px solid rgba(150, 150, 150, 0.2);
}

.chip:hover {
    background: var(--primary-color);
    color: white;
    border-color: var(--primary-color);
}
</style>
{% endblock %}
